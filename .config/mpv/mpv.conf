# === VIDEO OUTPUT ===
vo=gpu-next                  # renderer moderne (libplacebo), meilleur que l'ancien gpu
gpu-api=vulkan               # Vulkan > OpenGL avec gpu-next
profile=high-quality         # active spline36, correct-downscaling, dither-depth=auto, etc.

# === DÉCODAGE HARDWARE ===
hwdec=vaapi                  # Bristol Ridge supporte H264 VAAPI
hwdec-codecs=h264,hevc,vp9  # HEVC/VP9 en decode-only VAAPI si dispo

# === SCALING (override du profil) ===
# spline36 du profil high-quality est déjà bon.
# ewa_lanczos est meilleur mais plus lourd — à tester selon tes perfs :
# scale=ewa_lanczos
# cscale=spline36            # chroma : spline36 suffit largement
dscale=mitchell              # downscale : mitchell est le meilleur rapport qualité/perf

correct-downscaling=yes
linear-downscaling=yes
sigmoid-upscaling=yes

# === DITHER ===
dither-depth=auto
dither=fruit                 # "ordered" si tu as un vrai écran 10-bit

# === DEBAND ===
deband=yes                   # réduit le banding sur les dégradés compressés
deband-iterations=2
deband-threshold=35
deband-range=16
deband-grain=4

# === SYNC / INTERPOLATION ===
video-sync=display-resample  # sync sur le refresh de l'écran
interpolation=yes            # motion interpolation légère
tscale=oversample            # algo léger, parfait pour du 24/25/30fps → 60Hz

# === AUDIO ===
ao=pipewire
audio-channels=stereo        # adapter si tu as un setup surround

# === MISC ===
save-position-on-quit=yes    # reprend où tu t'es arrêté
screenshot-format=png
screenshot-high-bit-depth=yes

scripts-append=/usr/lib/mpv-mpris/mpris.so
