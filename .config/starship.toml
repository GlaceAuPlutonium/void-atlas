format = """
[░▒▓](#a3aed2)\
$username\
[](bg:#769ff0 fg:#a3aed2)\
$directory\
[](fg:#769ff0 bg:#394260)\
$git_branch\
$git_status\
[](fg:#394260 bg:#212736)\
$rust\
[](fg:#212736 bg:#1d2230)\
$time\
[ ](fg:#1d2230)\
\n$character"""

right_format = """
[](fg:#1d2230)\
$cmd_duration\
$status\
$sudo\
[](fg:#1d2230)\
"""

[username]
show_always = true
style_user = "bg:#a3aed2 fg:#1e1f1f"
style_root = "bg:#a3aed2"
format = '[  $user ]($style)'

[directory]
style = "fg:#e3e5e5 bg:#769ff0"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙"
"Downloads" = ""
"Music" = ""
"Pictures" = ""

[cmd_duration]
min_time = 2_000
min_time_to_notify = 2_000
style = "fg:#a0a9cb bg:#1d2230"
format = '[  $duration]($style)'

[git_branch]
symbol = ""
format = '[[ $symbol $branch ](fg:#769ff0 bg:#394260)]($style)'

[git_status]
format = '[[($all_status$ahead_behind )](fg:#769ff0 bg:#394260)]($style)'

[time]
disabled = false
time_format = "%R" # H:M Format
format = '[[  $time ](fg:#a0a9cb bg:#1d2230)]($style)'

[rust]
symbol = ""
format = '[[ $symbol($version) ](fg:#769ff0 bg:#212736)]($style)'

[sudo]
style = 'fg:green bg:#1d2230'
symbol = ''
format = "[ $symbol]($style)"
disabled = false

[status]
style = 'fg:red bg:#1d2230'
format = '[ ✘ $int]($style)'
map_symbol = true
disabled = false
